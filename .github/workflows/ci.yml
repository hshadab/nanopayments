name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Verify no secrets committed
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo "ERROR: .env is tracked. Remove it and add to .gitignore."
            exit 1
          fi
          if git grep -E '(PRIVATE_KEY|ICME_API_KEY)\s*=\s*0x[0-9a-fA-F]{40,}' -- ':!.env.example' ':!*.md'; then
            echo "ERROR: hardcoded private key or API key found in tracked files."
            exit 1
          fi
          echo "OK: no obvious secret leakage detected."
